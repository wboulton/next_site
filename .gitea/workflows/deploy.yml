name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_ROOT }}
          SSH_KEY:  ${{ secrets.SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            set -ex
            cd /home/cyberg/next_site
            git fetch origin
            git reset --hard origin/main
            git log -1 --oneline

            docker build --pull -t next-site:new .

            docker rm -f next-site-new || true
            trap "docker rm -f next-site-new >/dev/null 2>&1 || true" EXIT
            bash scripts/run-container.sh next-site:new next-site-new 3001

            for i in {1..30}; do
              if curl -fs http://localhost:3001 > /dev/null; then
                echo "New container is healthy"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "New container failed health check"
                docker logs next-site-new
                docker rm -f next-site-new
                exit 1
              fi
              sleep 1
            done

            bash scripts/check-sandbox.sh next-site-new

            docker rm -f next-site-new
            trap - EXIT
            docker rm -f next-site || true
            docker tag next-site:new next-site:latest
            bash scripts/run-container.sh next-site:latest next-site 3000

            echo "==DONE=="
          '
