name: "next-site"
mode: ONCE
hostname: "next-site"
cwd: "/app"
log_level: WARNING
forward_signals: true

# This is a persistent HTTP server. Docker enforces memory and process limits;
# V8 needs a large virtual address space even with a small physical heap.
time_limit: 0
rlimit_as_type: INF
rlimit_cpu_type: INF
rlimit_fsize: 64
rlimit_nofile: 1024
nice_level: 0

clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
# Retain Docker's network namespace so -p can reach the HTTP listener.
clone_newnet: false
uidmap { inside_id: "1000" outside_id: "1000" count: 1 }
gidmap { inside_id: "1000" outside_id: "1000" count: 1 }
keep_caps: false
disable_no_new_privs: false
keep_env: false
envar: "NODE_ENV=production"
envar: "NEXT_TELEMETRY_DISABLED=1"
envar: "NODE_OPTIONS=--max-old-space-size=256"
envar: "HOSTNAME=0.0.0.0"
envar: "PORT=3000"
envar: "HOME=/tmp"
envar: "PATH=/usr/local/bin"

# Start from nsjail's empty root. Expose only the app, Node and its libraries;
# neither a shell nor the supervisor/configuration is visible in the jail.
mount { src: "/app" dst: "/app" is_bind: true nosuid: true nodev: true }
mount { src: "/usr/local/bin/node" dst: "/usr/local/bin/node" is_bind: true nosuid: true }
mount { src: "/lib" dst: "/lib" is_bind: true nosuid: true nodev: true }
mount { src: "/lib64" dst: "/lib64" is_bind: true nosuid: true nodev: true mandatory: false }
mount { src: "/usr/lib" dst: "/usr/lib" is_bind: true nosuid: true nodev: true }
mount { src: "/etc/ssl/certs" dst: "/etc/ssl/certs" is_bind: true nosuid: true nodev: true noexec: true }
mount { src: "/etc/resolv.conf" dst: "/etc/resolv.conf" is_bind: true nosuid: true nodev: true noexec: true }
mount { src: "/etc/hosts" dst: "/etc/hosts" is_bind: true nosuid: true nodev: true noexec: true }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true nosuid: true noexec: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true nosuid: true noexec: true }
mount { dst: "/proc" fstype: "proc" nosuid: true nodev: true noexec: true }
mount { dst: "/tmp" fstype: "tmpfs" options: "size=64m,mode=1777" rw: true nosuid: true nodev: true noexec: true }
mount { dst: "/app/.next/cache" fstype: "tmpfs" options: "size=128m,uid=1000,gid=1000,mode=0700" rw: true nosuid: true nodev: true noexec: true }

seccomp_policy_file: "/etc/nsjail/node.seccomp"
